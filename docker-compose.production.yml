version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: novaqa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-novaqa_production}
      POSTGRES_USER: ${POSTGRES_USER:-novaqa_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-novaqa_secure_db_pass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - novaqa-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-novaqa_admin} -d ${POSTGRES_DB:-novaqa_production}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: novaqa-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-novaqa_secure_redis_pass_2026}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - novaqa-internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-novaqa_secure_redis_pass_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: novaqa-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-novaqa_minio_root}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-novaqa_minio_secret_key_2026}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    networks:
      - novaqa-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: novaqa-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-novaqa_admin}:${POSTGRES_PASSWORD:-novaqa_secure_db_pass_2026}@postgres:5432/${POSTGRES_DB:-novaqa_production}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-novaqa_secure_redis_pass_2026}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-novaqa_super_secure_production_jwt_secret_key_2026_x89a_99b7c2f}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-30d}
      PAYMOB_API_KEY: ${PAYMOB_API_KEY:-mock_paymob_api_key}
      PAYMOB_SECRET_KEY: ${PAYMOB_SECRET_KEY:-mock_paymob_secret_key}
      PAYMOB_HMAC_SECRET: ${PAYMOB_HMAC_SECRET:-mock_paymob_hmac_secret_sha512}
      PAYMOB_INTEGRATION_ID_CARD: ${PAYMOB_INTEGRATION_ID_CARD:-123456}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_BUCKET: ${STORAGE_BUCKET:-novaqa-artifacts}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-novaqa_minio_root}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-novaqa_minio_secret_key_2026}
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      APP_URL: ${APP_URL:-https://novaqa.thebuildflow.site}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://novaqa.thebuildflow.site}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    ports:
      - "127.0.0.1:4000:4000"
    networks:
      - novaqa-internal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: novaqa-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      WORKER_PORT: 4001
      MAX_CONCURRENT_RUNS: ${MAX_CONCURRENT_RUNS:-8}
      DATABASE_URL: postgresql://${POSTGRES_USER:-novaqa_admin}:${POSTGRES_PASSWORD:-novaqa_secure_db_pass_2026}@postgres:5432/${POSTGRES_DB:-novaqa_production}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-novaqa_secure_redis_pass_2026}@redis:6379/0
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_BUCKET: ${STORAGE_BUCKET:-novaqa-artifacts}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-novaqa_minio_root}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-novaqa_minio_secret_key_2026}
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-mock}
    networks:
      - novaqa-internal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4001/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: novaqa-mcp
    stdin_open: true
    tty: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-novaqa_admin}:${POSTGRES_PASSWORD:-novaqa_secure_db_pass_2026}@postgres:5432/${POSTGRES_DB:-novaqa_production}?schema=public
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-mock}
    networks:
      - novaqa-internal

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: novaqa-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-novaqa_admin}:${POSTGRES_PASSWORD:-novaqa_secure_db_pass_2026}@postgres:5432/${POSTGRES_DB:-novaqa_production}?schema=public
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
      NEXT_PUBLIC_APP_URL: ${APP_URL:-https://novaqa.thebuildflow.site}
    ports:
      - "127.0.0.1:3050:3000"
    networks:
      - novaqa-internal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  novaqa-internal:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
