version: '3.8'

# ============================================================================
# NovaQA Compose Stack for VPS with Native Host PostgreSQL & Nginx
# ============================================================================
# Use this file if you already have PostgreSQL and Nginx installed on your VPS host.
# Run: docker compose -f docker-compose.vps-native.yml --env-file .env.production up -d --build

services:
  # 1. In-Memory Cache, Rate Limiting & Queue
  redis:
    image: redis:7-alpine
    container_name: novaqa-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-novaqa_secure_redis_pass_2026}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-novaqa_secure_redis_pass_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Object Storage (MinIO)
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: novaqa-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-novaqa_minio_root}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-novaqa_minio_secret_key_2026}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  # 3. Backend REST & WebSocket API
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: novaqa-api
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@host.docker.internal:5432/novaqa?schema=public}
      REDIS_URL: redis://:${REDIS_PASSWORD:-novaqa_secure_redis_pass_2026}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-novaqa_super_secure_production_jwt_secret_key_2026_x89a_99b7c2f}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-30d}
      PAYMOB_API_KEY: ${PAYMOB_API_KEY:-mock_paymob_api_key}
      PAYMOB_SECRET_KEY: ${PAYMOB_SECRET_KEY:-mock_paymob_secret_key}
      PAYMOB_HMAC_SECRET: ${PAYMOB_HMAC_SECRET:-mock_paymob_hmac_secret_sha512}
      PAYMOB_INTEGRATION_ID_CARD: ${PAYMOB_INTEGRATION_ID_CARD:-123456}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_BUCKET: ${STORAGE_BUCKET:-novaqa-artifacts}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-novaqa_minio_root}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-novaqa_minio_secret_key_2026}
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      APP_URL: ${APP_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # 4. Next.js Web App
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: novaqa-web
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@host.docker.internal:5432/novaqa?schema=public}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
      NEXT_PUBLIC_APP_URL: ${APP_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:${WEB_PORT:-3050}:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3

  # 5. Background Execution Worker (Playwright)
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: novaqa-worker
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      WORKER_PORT: 4001
      MAX_CONCURRENT_RUNS: ${MAX_CONCURRENT_RUNS:-8}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@host.docker.internal:5432/novaqa?schema=public}
      REDIS_URL: redis://:${REDIS_PASSWORD:-novaqa_secure_redis_pass_2026}@redis:6379/0
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_BUCKET: ${STORAGE_BUCKET:-novaqa-artifacts}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-novaqa_minio_root}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-novaqa_minio_secret_key_2026}
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-mock}

  # 6. MCP Protocol Server
  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: novaqa-mcp
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@host.docker.internal:5432/novaqa?schema=public}
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-mock}

volumes:
  redis_data:
    driver: local
  minio_data:
    driver: local
